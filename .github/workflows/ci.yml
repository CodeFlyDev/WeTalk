# 后端 CI：构建测试 + 三服务镜像发布（Task.md · 系统服务部署 · Step 6）
# Phase 8 微服务化：按 MODULE 矩阵构建 core / ai / gateway 三镜像，推送 GHCR，tag = git sha
# 如需 Harbor，改 REGISTRY/IMAGE_PREFIX 并配置对应 Secrets
name: Backend CI

on:
  push:
    branches: [main]
    paths: ["wetalk-server/**", "wetalk-infra/docker/Dockerfile.server", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["wetalk-server/**", "wetalk-infra/docker/Dockerfile.server", ".github/workflows/ci.yml"]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/wetalk

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build & Test
        working-directory: wetalk-server
        run: mvn -B -ntp package

  docker-image:
    # main 分支合并后构建镜像（tag = git sha + latest），供 helm upgrade 使用
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - module: wetalk-app      # IM 主链路 core 服务
            image: wetalk-core
          - module: wetalk-ai-app   # AI 域独立服务
            image: wetalk-ai
          - module: wetalk-gateway  # API 网关
            image: wetalk-gateway
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.image }}
          tags: |
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: wetalk-infra/docker/Dockerfile.server
          push: true
          build-args: |
            MODULE=${{ matrix.module }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
