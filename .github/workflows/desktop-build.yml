# Tauri 桌面端构建：打 v* 标签或手动触发，产出三平台安装包并发布 GitHub Releases
# 产物：Windows .msi / macOS .dmg / Linux .AppImage+.deb（Tauri Updater 依赖此 Release）
name: Desktop Build

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            bundles: msi
          - os: macos-latest
            bundles: dmg
          - os: ubuntu-22.04
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      # Tauri 前端复用 wetalk-web 产物（tauri.conf.json: frontendDist=../wetalk-web/dist）
      - name: Build web frontend
        working-directory: wetalk-web
        run: |
          npm install
          npm run build

      - name: Install Linux deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: wetalk-desktop
          args: --bundles ${{ matrix.bundles }}
          tagName: v__VERSION__
          releaseName: "WeTalk v__VERSION__"
          releaseBody: "桌面端安装包：Windows (.msi) / macOS (.dmg) / Linux (.AppImage, .deb)"
          releaseDraft: false
          prerelease: false
