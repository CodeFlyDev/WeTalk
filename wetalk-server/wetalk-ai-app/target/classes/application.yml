server:
  port: 8080

spring:
  application:
    name: wetalk-ai

  # auth→user 传递引入了 spring-data-jpa 但 AI 服务无数据库，排除数据源自动装配
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

  # ---- Elasticsearch（RAG 知识库 dense_vector，独立 index）----
  elasticsearch:
    uris: ${ES_URIS:http://localhost:9200}

  cloud:
    nacos:
      discovery:
        # 本机无 Nacos 直跑时设 NACOS_ENABLED=false
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:localhost:8848}
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}

# ---- WeTalk 自有配置（与 core 共用 JWT 密钥，本地校验 Bearer）----
wetalk:
  jwt:
    secret: ${JWT_SECRET:dev-jwt-secret-change-me-32bytes!!}
    access-expire-minutes: 120
    refresh-expire-days: 14
  # 上游 core 服务（参与者校验/消息/用户资料经此查询）
  core:
    url: ${CORE_URL:http://localhost:8080}
  minio:
    endpoint: ${MINIO_ENDPOINT:http://localhost:9000}
    access-key: ${MINIO_ACCESS_KEY:minioadmin}
    secret-key: ${MINIO_SECRET_KEY:minioadmin}
    bucket: wetalk
  ai:
    whisper-url: ${WHISPER_URL:http://localhost:8001}
    whisper-model: ${WHISPER_MODEL:Systran/faster-whisper-small}
    ollama-url: ${OLLAMA_URL:http://localhost:11434}
    ollama-model: ${OLLAMA_MODEL:qwen2.5:1.5b}
    # RAG 向量模型（需 docker compose exec ollama ollama pull nomic-embed-text）
    ollama-embed-model: ${OLLAMA_EMBED_MODEL:nomic-embed-text}

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: when_authorized
  metrics:
    tags:
      application: ${spring.application.name}
