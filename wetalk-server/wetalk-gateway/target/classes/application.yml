server:
  port: 8080

spring:
  application:
    name: wetalk-gateway
  cloud:
    nacos:
      discovery:
        # 本机无 Nacos 直跑时设 NACOS_ENABLED=false（路由需同步改为静态 uri）
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:localhost:8848}
    sentinel:
      enabled: ${SENTINEL_ENABLED:true}
      transport:
        dashboard: ${SENTINEL_DASHBOARD:localhost:8858}
    gateway:
      routes:
        # AI 域服务（已拆分独立进程）
        - id: ai
          uri: lb://wetalk-ai
          predicates: [ "Path=/api/ai/**" ]
        # IM 主链路 core（auth/user/friend/group/message/voip/...）
        - id: core-api
          uri: lb://wetalk-core
          predicates: [ "Path=/api/**" ]
        # WebSocket + SockJS fallback（SCG 对 ws upgrade 自动转发）
        - id: core-ws
          uri: lb://wetalk-core
          predicates: [ "Path=/ws/**" ]

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  metrics:
    tags:
      application: ${spring.application.name}
