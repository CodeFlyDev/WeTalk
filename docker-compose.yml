# =============================================================================
# WeTalk 基础设施编排 —— 本地开发 / 单服务器部署（Task.md · 系统服务部署）
#
# 用法：
#   cp .env.example .env                  # 必须先配置密码与密钥
#   docker compose up -d                  # 拉起全部基础设施
#                                         # (MySQL/MongoDB/Redis/ES/MinIO/Kafka/Nacos/Sentinel/coturn
#                                         #  + SkyWalking/Prometheus/Grafana/Loki 可观测性栈)
#   docker compose build wetalk-core wetalk-ai wetalk-gateway   # 构建业务服务镜像（profile: app）
#   docker compose --profile app up -d    # 启动业务服务（gateway:8080 → core:8082 / ai:8083，已挂 SkyWalking agent）
#
# 注意：
#   1. Elasticsearch 要求宿主机 vm.max_map_count >= 262144
#      Linux: sudo sysctl -w vm.max_map_count=262144（写入 /etc/sysctl.conf 持久化）
#      Docker Desktop (WSL2) 通常已满足
#   2. ES / Keycloak 此处为开发模式（未开 TLS），生产集群形态参考 Task.md · 多服务器部署
#   3. Phase 8 起 8080 为网关统一入口；core/ai 宿主机映射 8082/8083 仅便于直调调试（8081 已被 keycloak 占用）
# =============================================================================

name: wetalk

networks:
  wetalk-net:
    driver: bridge

volumes:
  mysql-data:
  mongo-data:
  redis-data:
  es-data:
  minio-data:
  kafka-data:
  keycloak-data:
  rocketmq-broker-data:
  rocketmq-broker-logs:
  ollama-data:
  grafana-data:
  loki-data:

services:
  mysql:
    image: mysql:8.4
    container_name: wetalk-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: wetalk
      MYSQL_USER: wetalk
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks: [wetalk-net]

  mongo:
    image: mongo:7
    container_name: wetalk-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: root
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: mongosh --quiet --eval 'db.adminCommand("ping").ok' | grep -q 1
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [wetalk-net]

  redis:
    image: redis:7
    container_name: wetalk-redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: redis-cli -a "${REDIS_PASSWORD}" ping | grep -q PONG
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [wetalk-net]

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.14.3
    container_name: wetalk-es
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"     # 开发模式；生产启用 TLS + 认证
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"   # 小内存机器按需调整
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: curl -fs http://localhost:9200/_cluster/health || exit 1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 40s
    networks: [wetalk-net]

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    container_name: wetalk-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # 控制台
    volumes:
      - minio-data:/data
    healthcheck:
      test: curl -fs http://localhost:9000/minio/health/live || exit 1
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [wetalk-net]

  # 本地语音转写（OpenAI 兼容 /v1/audio/transcriptions；首次启动自动下载模型）
  whisper:
    image: fedirz/faster-whisper-server:latest-cpu
    container_name: wetalk-whisper
    restart: unless-stopped
    environment:
      WHISPER__MODEL: ${WHISPER_MODEL:Systran/faster-whisper-small}
    ports:
      - "8001:8000"
    networks: [wetalk-net]

  # 本地 LLM（AI 助手 / 聊天摘要）：首次使用需手动拉模型
  #   docker compose exec ollama ollama pull qwen2.5:1.5b
  # GPU 机器可追加 deploy.resources.reservations.devices（nvidia）或换 ollama/ollama:rocm
  ollama:
    image: ollama/ollama:latest
    container_name: wetalk-ollama
    restart: unless-stopped
    environment:
      OLLAMA_MODEL: ${OLLAMA_MODEL:qwen2.5:1.5b}
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks: [wetalk-net]

  # RocketMQ（红包事务消息）：namesrv 9876 + broker 10909/10911
  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: wetalk-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "9876:9876"
    networks: [wetalk-net]

  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: wetalk-rocketmq-broker
    restart: unless-stopped
    command: sh mqbroker -n rocketmq-namesrv:9876 -c /home/rocketmq/conf/broker.conf
    depends_on: [rocketmq-namesrv]
    environment:
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "10909:10909"   # VIP 通道
      - "10911:10911"   # remoting 主端口（宿主机 Java 客户端直连）
    volumes:
      - ./wetalk-infra/docker/rocketmq/broker.conf:/home/rocketmq/conf/broker.conf:ro
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    healthcheck:
      test: ["CMD-SHELL", "sh mqadmin clusterList -n rocketmq-namesrv:9876 | grep -q broker-a"]
      interval: 20s
      timeout: 15s
      retries: 10
      start_period: 30s
    networks: [wetalk-net]

  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: wetalk-kafka
    restart: unless-stopped
    environment:
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: "broker,controller"
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:29093"
      KAFKA_LISTENERS: "PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092"
      KAFKA_ADVERTISED_LISTENERS: "PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      KAFKA_INTER_BROKER_LISTENER_NAME: "PLAINTEXT"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "9092:9092"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092 >/dev/null 2>&1
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks: [wetalk-net]

  # 一次性初始化 Kafka Topic（对齐 Task.md 消息链路：离线投递 / 领域事件 / 审计）
  kafka-init:
    image: confluentinc/cp-kafka:7.6.1
    depends_on:
      kafka:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/bash", "-c"]
    command:
      - kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic wetalk.msg.offline --partitions 6 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic wetalk.event.domain --partitions 3 --replication-factor 1 && kafka-topics --bootstrap-server kafka:29092 --create --if-not-exists --topic wetalk.msg.audit --partitions 3 --replication-factor 1 && echo "Kafka topics ready."
    networks: [wetalk-net]

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: wetalk-keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KC_HOSTNAME_STRICT: "false"
    ports:
      - "8081:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./wetalk-infra/docker/keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: curl -fs http://localhost:8080/ || exit 1
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    networks: [wetalk-net]

  # 服务注册发现（Phase 8 微服务化；standalone + 内嵌 derby 开发模式）
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: wetalk-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      TZ: Asia/Shanghai
    ports:
      - "8848:8848"   # 控制台 + OpenAPI
      - "9848:9848"   # gRPC 客户端通道（2.x 必需）
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks: [wetalk-net]

  # Sentinel 流控可视化控制台（规则内存态，生产持久化留 K8s 轮）
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.6
    container_name: wetalk-sentinel
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
    ports:
      - "8858:8858"   # 控制台（默认账号 sentinel/sentinel）
    networks: [wetalk-net]

  # ---------------- Phase 8 可观测性（指标 + 链路 + 日志）----------------
  # SkyWalking OAP（链路追踪后端；开发模式 H2 内存存储，重启即清，生产换 ES/BanyanDB）
  skywalking-oap:
    image: apache/skywalking-oap-server:10.1.0
    container_name: wetalk-skywalking-oap
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      JAVA_OPTS: "-Xms512m -Xmx1g"   # 开发机内存友好，生产按需调整
      SW_STORAGE: h2
    ports:
      - "11800:11800"   # gRPC 收数通道（Java agent 上报）
      - "12800:12800"   # REST/GraphQL 查询 API（UI 消费）
    networks: [wetalk-net]

  skywalking-ui:
    image: apache/skywalking-ui:10.1.0
    container_name: wetalk-skywalking-ui
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    ports:
      - "8090:8080"     # 拓扑 / 链路 / 慢接口追踪控制台
    depends_on: [skywalking-oap]
    networks: [wetalk-net]

  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: wetalk-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
    volumes:
      - ./wetalk-infra/docker/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9091:9090"     # 宿主 9091（9090 已被 core 的 gRPC 映射占用）
    networks: [wetalk-net]

  grafana:
    image: grafana/grafana:11.1.0
    container_name: wetalk-grafana
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      GF_SECURITY_ADMIN_USER: admin        # 生产必须经 .env 覆盖
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
      - ./wetalk-infra/docker/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "3000:3000"     # 指标/日志面板（数据源已自动装配 Prometheus + Loki）
    depends_on: [prometheus, loki]
    networks: [wetalk-net]

  # 日志聚合（Loki 默认配置开箱即用，3.x 单二进制；开发模式无鉴权）
  loki:
    image: grafana/loki:3.1.0
    container_name: wetalk-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks: [wetalk-net]

  # 日志采集代理：docker_sd 发现 compose 容器 stdout/stderr → 推送 Loki
  promtail:
    image: grafana/promtail:3.1.0
    container_name: wetalk-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - ./wetalk-infra/docker/promtail/promtail.yml:/etc/promtail/config.yml:ro
    depends_on: [loki]
    networks: [wetalk-net]

  # WebRTC TURN 中继 —— 云服务器部署必须先在 .env 填写 TURN_PUBLIC_IP / TURN_SECRET
  coturn:
    image: coturn/coturn:latest
    container_name: wetalk-coturn
    restart: unless-stopped
    command: >
      -n --realm=wetalk
      --listening-port=3478
      --tls-listening-port=5349
      --min-port=49160
      --max-port=49200
      --external-ip=${TURN_PUBLIC_IP}
      --use-auth-secret
      --static-auth-secret=${TURN_SECRET}
      --no-multicast-peers
      --no-cli
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "49160-49200:49160-49200/udp"
    networks: [wetalk-net]

  # 业务服务（profile: app）—— Phase 8 微服务化：gateway(8080) 统一入口 → core(8082) + ai(8083)
  wetalk-core:
    build:
      context: .
      dockerfile: wetalk-infra/docker/Dockerfile.server
      args:
        MODULE: wetalk-app
    image: wetalk-core:1.0.0
    container_name: wetalk-core
    profiles: ["app"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: "docker"
      MYSQL_URL: "jdbc:mysql://mysql:3306/wetalk?useSSL=false&serverTimezone=Asia/Shanghai"
      MYSQL_USERNAME: "wetalk"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MONGO_URI: "mongodb://root:${MONGO_INITDB_ROOT_PASSWORD}@mongo:27017/wetalk?authSource=admin"
      REDIS_HOST: "redis"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: "kafka:29092"
      ROCKETMQ_NAMESRV: "rocketmq-namesrv:9876"
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      KEYCLOAK_ISSUER: "http://keycloak:8080/realms/wetalk"
      NACOS_ADDR: "nacos:8848"
      SENTINEL_DASHBOARD: "sentinel-dashboard:8858"
      SW_AGENT_ENABLED: "true"
      SW_AGENT_NAME: "wetalk-core"
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
    ports:
      - "8082:8080"                     # HTTP / WebSocket（宿主机直调用；外部统一走 gateway:8080）
      - "9090:9090"                     # gRPC（服务间）
      - "40000-40100:40000-40100/udp"   # Mediasoup SFU 媒体端口
    depends_on:
      nacos:
        condition: service_healthy
      mysql:
        condition: service_healthy
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
      kafka:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
      keycloak:
        condition: service_healthy
    networks: [wetalk-net]

  # AI 域独立服务（助手/摘要/转写/RAG）：经 CORE_URL 调 core 做参与者校验，直读 MinIO/ES/Ollama/Whisper
  wetalk-ai:
    build:
      context: .
      dockerfile: wetalk-infra/docker/Dockerfile.server
      args:
        MODULE: wetalk-ai-app
    image: wetalk-ai:1.0.0
    container_name: wetalk-ai
    profiles: ["app"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: "docker"
      CORE_URL: "http://wetalk-core:8080"
      JWT_SECRET: ${JWT_SECRET}
      MINIO_ENDPOINT: "http://minio:9000"
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      ES_URIS: "http://elasticsearch:9200"
      WHISPER_URL: "http://whisper:8000"
      OLLAMA_URL: "http://ollama:11434"
      OLLAMA_MODEL: ${OLLAMA_MODEL:qwen2.5:1.5b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:nomic-embed-text}
      NACOS_ADDR: "nacos:8848"
      SENTINEL_DASHBOARD: "sentinel-dashboard:8858"
      SW_AGENT_ENABLED: "true"
      SW_AGENT_NAME: "wetalk-ai"
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
    ports:
      - "8083:8080"                     # 宿主机直调用；外部统一走 gateway:8080
    depends_on:
      nacos:
        condition: service_healthy
      wetalk-core:
        condition: service_started
      elasticsearch:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks: [wetalk-net]

  # API 网关（统一入口：/api/ai/** → wetalk-ai，/api/** 与 /ws/** → wetalk-core）
  wetalk-gateway:
    build:
      context: .
      dockerfile: wetalk-infra/docker/Dockerfile.server
      args:
        MODULE: wetalk-gateway
    image: wetalk-gateway:1.0.0
    container_name: wetalk-gateway
    profiles: ["app"]
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      SPRING_PROFILES_ACTIVE: "docker"
      NACOS_ADDR: "nacos:8848"
      SENTINEL_DASHBOARD: "sentinel-dashboard:8858"
      SW_AGENT_ENABLED: "true"
      SW_AGENT_NAME: "wetalk-gateway"
      SW_AGENT_COLLECTOR_BACKEND_SERVICES: "skywalking-oap:11800"
    ports:
      - "8080:8080"                     # 前端统一入口（HTTP + WebSocket）
    depends_on:
      nacos:
        condition: service_healthy
      wetalk-core:
        condition: service_started
      wetalk-ai:
        condition: service_started
    networks: [wetalk-net]
