# RocketMQ Broker —— 本地开发 / 单服务器
# 注意：宿主机 Java 进程通过 namesrv(9876) 拿到 broker 地址后直连 10911，
#       brokerIP1 必须是客户端可达地址：
#         - Windows/macOS Docker Desktop 用 host.docker.internal
#         - Linux 宿主机部署改为宿主机内网 IP；容器化部署 wetalk-server 时改为服务名
brokerClusterName = DefaultCluster
brokerName = broker-a
brokerId = 0
brokerIP1 = host.docker.internal
namesrvAddr = rocketmq-namesrv:9876
autoCreateTopicEnable = true
brokerRole = ASYNC_MASTER
flushDiskType = ASYNC_FLUSH
listenPort = 10911
deleteWhen = 04
fileReservedTime = 48
