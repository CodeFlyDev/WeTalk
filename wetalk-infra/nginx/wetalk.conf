# =============================================================================
# WeTalk Nginx 配置 —— 单服务器形态（Task.md · 系统服务部署 · Step 4）
# 用法：放入 /etc/nginx/conf.d/ 后 nginx -t && systemctl reload nginx
# 证书：certbot --nginx -d wetalk.example.com
# =============================================================================

# 多服务器集群形态：取消注释并将 proxy_pass 指向 upstream（Task.md · Step 3）
# upstream wetalk_app {
#     ip_hash;                      # WebSocket 会话保持
#     server app-01:8080 max_fails=2 fail_timeout=10s;
#     server app-02:8080 max_fails=2 fail_timeout=10s;
#     server app-03:8080 max_fails=2 fail_timeout=10s;
# }

server {
    listen 80;
    server_name wetalk.example.com;
    # 证书就绪前可临时注释下一行，先走 HTTP 调试
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name wetalk.example.com;

    # ssl_certificate     /etc/letsencrypt/live/wetalk.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/wetalk.example.com/privkey.pem;

    # Web 前端静态资源（wetalk-web/dist）
    root /opt/wetalk/wetalk-web/dist;
    index index.html;

    # React SPA 前端路由
    location / {
        try_files $uri $uri/ /index.html;
    }

    # REST API
    location /api/ {
        proxy_pass http://127.0.0.1:8080;    # 集群形态改为 http://wetalk_app
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket（关键：Upgrade 头 + 长超时）
    location /ws {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
