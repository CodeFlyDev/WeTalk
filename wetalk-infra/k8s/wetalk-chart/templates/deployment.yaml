{{- range $name, $svc := .Values.services }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wetalk.svcname" (list $ $name) }}
  labels:
    app: {{ include "wetalk.fullname" $ }}
    service: {{ $name }}
spec:
  {{- if not $svc.hpa.enabled }}
  replicas: {{ $svc.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ include "wetalk.fullname" $ }}
      service: {{ $name }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: {{ include "wetalk.fullname" $ }}
        service: {{ $name }}
    spec:
      {{- with $.Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: wetalk-{{ $name }}
          image: "{{ $svc.image.repository }}:{{ $svc.image.tag | default $.Values.global.image.tag }}"
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            {{- range $port := $svc.ports }}
            - name: {{ $port.name }}
              containerPort: {{ $port.containerPort }}
            {{- end }}
          env:
            {{- /* 服务级 env 优先，global.env 兜底（SW_AGENT_COLLECTOR_BACKEND_SERVICES 等） */}}
            {{- range $k, $v := $.Values.global.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
            {{- range $k, $v := $svc.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
{{- end }}
