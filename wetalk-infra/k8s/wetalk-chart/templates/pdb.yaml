{{- range $name, $svc := .Values.services }}
{{- if $svc.pdb.enabled }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "wetalk.svcname" (list $ $name) }}
  labels:
    app: {{ include "wetalk.fullname" $ }}
    service: {{ $name }}
spec:
  minAvailable: {{ $svc.pdb.minAvailable }}
  selector:
    matchLabels:
      app: {{ include "wetalk.fullname" $ }}
      service: {{ $name }}
{{- end }}
{{- end }}
