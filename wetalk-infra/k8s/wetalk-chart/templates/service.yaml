{{- range $name, $svc := .Values.services }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "wetalk.svcname" (list $ $name) }}
  labels:
    app: {{ include "wetalk.fullname" $ }}
    service: {{ $name }}
spec:
  type: ClusterIP
  {{- if $svc.service.sessionAffinity }}
  # WebSocket 会话亲和（集群形态可改 Istio consistentHash，见 wetalk-infra/istio/）
  sessionAffinity: {{ $svc.service.sessionAffinity }}
  {{- end }}
  selector:
    app: {{ include "wetalk.fullname" $ }}
    service: {{ $name }}
  ports:
    - name: http
      port: {{ $svc.service.port }}
      targetPort: http
{{- end }}
