apiVersion: v1
kind: Service
metadata:
  name: {{ include "wetalk.fullname" . }}
  labels:
    app: {{ include "wetalk.fullname" . }}
spec:
  type: {{ .Values.service.type }}
  # WebSocket 会话亲和（集群形态可改 Istio consistentHash）
  sessionAffinity: ClientIP
  selector:
    app: {{ include "wetalk.fullname" . }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
